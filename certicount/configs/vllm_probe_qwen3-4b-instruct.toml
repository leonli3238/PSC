# Degree probe: Qwen3-4B-Instruct-2507 node model. The 2507 instruct model has no thinking switch,
# so chat_template_kwargs is omitted; everything else matches the 1.7B / 8B runs.

provider = "vllm"
temperature = 0.0
max_concurrency = 128
stream = false
max_retries = 4
retry_backoff = 5.0

[vllm]
node_model = "Qwen3-4B"
curator_model = "Qwen3-4B"  # unused by the probe

[vllm.extra]
max_tokens = 4096
