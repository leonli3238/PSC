# GLM-5.2 (non-thinking) for both node and curator,
# through the OpenAI-compatible gateway in .env (OPENAI_API_KEY, OPENAI_BASE_URL).
# Naive only calls the curator model (DP framework selection + answer on the noisy graph).

provider = "openai"
temperature = 0.0     # paper: 0
max_concurrency = 8
parallel_runs = 8
stream = true         # the gateway rejects non-stream requests
max_retries = 4
retry_backoff = 5.0

[openai]
node_model = "glm-5.2"
curator_model = "glm-5.2"

[openai.extra]
# The gateway currently defaults GLM-5.2 to non-thinking, but the official API defaults to thinking
extra_body = { thinking = { type = "disabled" } }
