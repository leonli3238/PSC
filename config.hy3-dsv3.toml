# Curator (and privacy controller) hy3-ioa, node agents DeepSeek-V3-0324, both through the
# OpenAI-compatible gateway in .env (OPENAI_API_KEY, OPENAI_BASE_URL).

provider = "openai"
temperature = 0.0     # paper: 0
max_concurrency = 8
parallel_runs = 8
stream = true         # the gateway rejects non-stream requests
max_retries = 4
retry_backoff = 5.0

[openai]
node_model = "deepseek-v3-0324"
curator_model = "hy3-ioa"
