# GPT-4.1-mini for both node and curator, through the hub.oaifree.com gateway.
# Paper: node = gpt-4.1-mini, curator = gpt-4.1; Naive only calls the curator model, so
# this is a small-model reference for Naive.
# Key and URL are read from .env.oaifree2 (OPENAI_API_KEY, OPENAI_BASE_URL), not from .env.

env_file = ".env.oaifree2"
provider = "openai"
temperature = 0.0     # paper: 0
# The gateway's upstream rate-limits accounts (429 user_global_rate_limited), so stay
# slow and wait long between retries
max_concurrency = 2
parallel_runs = 2
stream = false
max_retries = 5
retry_backoff = 20.0

[openai]
node_model = "gpt-4.1-mini"
curator_model = "gpt-4.1-mini"
